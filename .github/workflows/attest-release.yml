name: Verify and attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and attest
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check manifest matches the release tag
        run: test "$RELEASE_TAG" = "$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).version')"
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint -- --max-warnings 0
      - run: npm run build
      - name: Verify published assets match this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern main.js --pattern manifest.json --pattern styles.css
          cmp main.js release-assets/main.js
          cmp manifest.json release-assets/manifest.json
          cmp styles.css release-assets/styles.css
      - name: Attest verified release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
